<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物种识别</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; max-width: 400px; margin: auto; }
        h2 { text-align: center; }
        #result { margin-top: 20px; white-space: pre-line; color: #333; }
        input[type=file] { margin-bottom: 15px; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="image/*" required><br>
        <button type="submit">上传并识别</button>
    </form>
    <div id="result"></div>
</div>
<script>
const form = document.getElementById('uploadForm');
const fileInput = document.getElementById('fileInput');
const resultDiv = document.getElementById('result');

form.onsubmit = async function(e) {
    e.preventDefault();
    resultDiv.textContent = '识别中...';
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
        const res = await fetch('/predict', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (data.results) {
            let html = `<b>推理耗时：</b> ${data.inference_time_ms.toFixed(2)} ms<br><b>Top 3 预测结果：</b><ol>`;
            for (const item of data.results) {
                html += `<li>${item.species} <span style='color:#888;'>(概率: ${(item.probability * 100).toFixed(2)}%)</span></li>`;
            }
            html += '</ol>';
            resultDiv.innerHTML = html;
        } else {
            resultDiv.textContent = '识别失败: ' + (data.error || '未知错误');
        }
    } catch (err) {
        resultDiv.textContent = '请求出错: ' + err;
    }
};
</script>
</body>
</html>
